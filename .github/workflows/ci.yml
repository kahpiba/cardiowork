name: CardioWork Continuous Integration (CI)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ----------------------------------------------------------------------------
  # 1. PENDETEKSI KEBOCORAN RAHASIA & PRIVASI DATA (Gitleaks)
  # ----------------------------------------------------------------------------
  secret-scan:
    name: Secret & Privacy Leak Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Detector
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ----------------------------------------------------------------------------
  # 2. VALIDASI WEB & MONOREPO (Next.js, TypeScript, Lint, Test)
  # ----------------------------------------------------------------------------
  web-ci:
    name: Web App Verification & Build
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.7.0

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck Shared & Web
        run: pnpm typecheck

      - name: Lint Codebase
        run: pnpm lint

      - name: Run Unit Tests
        run: pnpm test

      - name: Dry-Run Next.js Production Build
        run: pnpm build
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
          AUTH_SECRET: "dummy-build-secret-key-32-characters-minimum-length"

  # ----------------------------------------------------------------------------
  # 3. VALIDASI MODEL MACHINE LEARNING & UJI PARITAS PYTORCH <-> ONNX
  # ----------------------------------------------------------------------------
  ml-parity-ci:
    name: ML Evaluation & ONNX Parity Test
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest onnx onnxruntime numpy pydantic

      - name: Lint Python Code with Ruff
        run: |
          cd ml && ruff check .

      - name: Execute ML Unit Tests & ONNX Parity Test
        run: |
          cd ml && pytest -v tests/
