[project]
name = "cardiowork-ml"
version = "0.1.0"
description = "Pipeline Pelatihan Offline Machine Learning dan Deep Learning PyTorch untuk CardioWork"
authors = [{ name = "Kahpi Baiquni Arifani", email = "kahpi@upnjatim.ac.id" }]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2.0",
    "scikit-learn>=1.4.0",
    "lightgbm>=4.3.0",
    "xgboost>=2.0.3",
    "onnx>=1.15.0",
    "onnxruntime>=1.17.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pydantic>=2.6.0",
    "captum>=0.7.0",
    "shap>=0.45.0",
    "optuna>=3.6.0",
    "scipy>=1.12.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
