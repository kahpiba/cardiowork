version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cardiowork-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cardiowork_user
      POSTGRES_PASSWORD: cardiowork_password
      POSTGRES_DB: cardiowork
    ports:
      - "5432:5432"
    volumes:
      - cardiowork_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cardiowork_user -d cardiowork"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cardiowork-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - cardiowork_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  cardiowork_pgdata:
  cardiowork_redisdata:
